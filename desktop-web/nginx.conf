map $http_user_agent $is_mobile_web {
    default 0;
    ~*(android.*mobile|iphone|ipod|windows\ phone|blackberry|bb10|opera\ mini|mobile) 1;
}

server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        if ($is_mobile_web = 1) {
            return 302 /mobile-app.html;
        }

        try_files $uri $uri/ /index.html;
    }

    location = /mobile-app.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp|json|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
