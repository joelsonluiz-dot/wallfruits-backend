<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0B8F6A">
  <meta name="description" content="WallFruits mobile nativo para Android e iOS.">
  <title>WallFruits | App Nativo</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f8f6; color: #10211d; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .card { max-width: 420px; background: white; border-radius: 24px; padding: 24px; border: 1px solid #dfe9e5; box-shadow: 0 10px 30px rgba(0,0,0,.06); }
    .btn { display: block; margin-top: 12px; padding: 12px 16px; border-radius: 12px; text-align: center; text-decoration: none; font-weight: 700; }
    .primary { background: linear-gradient(135deg, #0b8f6a, #19c28f); color: white; }
    .ghost { background: #eff6f3; color: #15352d; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Use o app nativo no celular</h1>
    <p>A versao web e exclusiva para desktop. No mobile, use Android ou iOS nativo.</p>
    <a class="btn primary" href="https://play.google.com">Google Play</a>
    <a class="btn primary" href="https://www.apple.com/app-store/">App Store</a>
    <a class="btn ghost" href="/">Abrir web desktop</a>
  </main>
</body>
</html>
