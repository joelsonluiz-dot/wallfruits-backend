services:
  - type: web
    name: wallfruits-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips=* --workers ${WEB_CONCURRENCY:-1}
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: SECURITY_ENFORCE_PRODUCTION_HARDENING
        value: true
      - key: RATE_LIMIT_ENABLED
        value: true
      - key: JWT_ISSUER
        value: wallfruits-api
      - key: JWT_AUDIENCE
        value: wallfruits-clients
      - key: JWT_REQUIRE_ISSUER
        value: true
      - key: JWT_REQUIRE_AUDIENCE
        value: true
      - key: AI_ENFORCE_SUBSCRIPTION_GUARDRAILS
        value: true
      - key: REDIS_ENABLED
        value: false
      - key: REDIS_URL
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: AI_CACHE_TTL_SECONDS
        value: 120
      - key: AI_LOW_LATENCY_MODE
        value: true
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: SUPABASE_AUTH_ENABLED
        value: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Supabase Storage (media/CDN)
      - key: SUPABASE_STORAGE_ENABLED
        value: true
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      # Opcional: base pública (ex.: https://cdn.seudominio.com). Se vazio, usa SUPABASE_URL.
      - key: SUPABASE_STORAGE_PUBLIC_BASE_URL
        value: ""
      - key: SUPABASE_STORAGE_TIMEOUT_SECONDS
        value: 20
      - key: API_TITLE
        value: WallFruits API
      - key: API_VERSION
        value: 2.0.0
      - key: CORS_ORIGINS
        value: '["https://wallfruits-backend.onrender.com","https://wallfruits-api.onrender.com","https://wallfruits-ai-web.onrender.com","https://wallfruits.com.br"]'
      - key: ALLOWED_HOSTS
        value: '["wallfruits-backend.onrender.com","wallfruits-api.onrender.com"]'
      # E-mail — Resend (preencha no painel do Render)
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "WallFruits <noreply@wallfruits.com.br>"
      - key: EMAIL_ENABLED
        value: true
      - key: FRONTEND_URL
        value: "https://wallfruits.com.br"
      # Pagamentos — Stripe (preencha no painel do Render)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_BASIC
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_PRO_YEARLY
        sync: false
      - key: STRIPE_PRICE_PREMIUM
        sync: false
      - key: STRIPE_PRICE_PREMIUM_YEARLY
        sync: false
      - key: STRIPE_PRICE_ENTERPRISE
        sync: false
      - key: STRIPE_PRICE_ENTERPRISE_YEARLY
        sync: false
      # Performance (opcional): ajuste para 2 em planos com mais CPU/RAM.
      - key: WEB_CONCURRENCY
        value: "1"

  - type: worker
    name: wallfruits-ai-worker
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.celery_app.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: SECURITY_ENFORCE_PRODUCTION_HARDENING
        value: true
      - key: RATE_LIMIT_ENABLED
        value: true
      - key: JWT_ISSUER
        value: wallfruits-api
      - key: JWT_AUDIENCE
        value: wallfruits-clients
      - key: JWT_REQUIRE_ISSUER
        value: true
      - key: JWT_REQUIRE_AUDIENCE
        value: true
      - key: AI_ENFORCE_SUBSCRIPTION_GUARDRAILS
        value: true
      - key: REDIS_ENABLED
        value: false
      - key: REDIS_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini

  - type: web
    name: wallfruits-ai-web
    env: docker
    region: oregon
    plan: free
    rootDir: flutter_ai
    dockerfilePath: ./Dockerfile.flutter-web
    healthCheckPath: /
    domains:
      - wallfruits.com.br
