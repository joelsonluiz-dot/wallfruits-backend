name: Build Android APK (Native Kotlin)

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile_native/android-kotlin/WallFruitsAndroid/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          gradle -p mobile_native/android-kotlin/WallFruitsAndroid assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wallfruits-android-native-apk
          path: mobile_native/android-kotlin/WallFruitsAndroid/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare release APK asset
        shell: bash
        run: |
          cp mobile_native/android-kotlin/WallFruitsAndroid/app/build/outputs/apk/debug/app-debug.apk \
            mobile_native/android-kotlin/WallFruitsAndroid/app/build/outputs/apk/debug/wallfruits-android-latest.apk

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: WallFruits Android Latest
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: mobile_native/android-kotlin/WallFruitsAndroid/app/build/outputs/apk/debug/wallfruits-android-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
