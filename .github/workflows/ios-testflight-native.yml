name: iOS Native TestFlight

on:
  push:
    branches:
      - main
    paths:
      - 'mobile_native/ios-swift/**'
      - '.github/workflows/ios-testflight-native.yml'
      - 'docs/IOS_BETA_PRIVADA.md'
      - 'docs/CI_CD_MOBILE_PRODUCAO.md'
  workflow_dispatch:

jobs:
  build-and-upload-testflight:
    runs-on: macos-14
    permissions:
      contents: read

    env:
      APP_PROJECT_DIR: mobile_native/ios-swift/WallFruitsiOS
      APP_PROJECT_PATH: mobile_native/ios-swift/WallFruitsiOS/WallFruitsiOS.xcodeproj
      APP_SCHEME: WallFruitsiOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_PROJECT_DIR"
          xcodegen generate

      - name: Validate iOS project path
        shell: bash
        run: |
          set -euo pipefail
          test -d "$APP_PROJECT_PATH" || {
            echo "Projeto iOS nativo nao encontrado depois da geracao do XcodeGen."
            exit 1
          }

      - name: Setup Ruby + fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install fastlane
        shell: bash
        run: |
          set -euo pipefail
          gem install fastlane --no-document

      - name: Build and upload to TestFlight
        env:
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${APPLE_ISSUER_ID}" || -z "${APPLE_KEY_ID}" || -z "${APPLE_API_PRIVATE_KEY_BASE64}" || -z "${APPLE_TEAM_ID}" || -z "${IOS_BUNDLE_ID}" ]]; then
            echo "Secrets da Apple ausentes. Configure APPLE_ISSUER_ID, APPLE_KEY_ID, APPLE_API_PRIVATE_KEY_BASE64, APPLE_TEAM_ID, IOS_BUNDLE_ID."
            exit 1
          fi

          mkdir -p ~/.appstoreconnect/private_keys
          echo "${APPLE_API_PRIVATE_KEY_BASE64}" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${APPLE_KEY_ID}.p8

          cat > app_store_connect_api_key.json <<EOF
          {
            "key_id": "${APPLE_KEY_ID}",
            "issuer_id": "${APPLE_ISSUER_ID}",
            "key": "$(cat ~/.appstoreconnect/private_keys/AuthKey_${APPLE_KEY_ID}.p8 | sed ':a;N;$!ba;s/\n/\\n/g')"
          }
          EOF

          xcodebuild -list -project "$APP_PROJECT_PATH"

          fastlane run build_app \
            project:"$APP_PROJECT_PATH" \
            scheme:"$APP_SCHEME" \
            export_method:app-store \
            export_team_id:"${APPLE_TEAM_ID}" \
            xcargs:"DEVELOPMENT_TEAM=${APPLE_TEAM_ID} CODE_SIGN_STYLE=Automatic" \
            clean:true \
            output_directory:"build_ios" \
            output_name:"WallFruits.ipa"

          fastlane run upload_to_testflight \
            api_key_path:"app_store_connect_api_key.json" \
            app_identifier:"${IOS_BUNDLE_ID}" \
            skip_waiting_for_build_processing:true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: wallfruits-ios-ipa
          path: build_ios/*.ipa
