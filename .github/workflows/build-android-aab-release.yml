name: Build Android Release (AAB)

on:
  workflow_dispatch:
    inputs:
      upload_to_play:
        description: "Publicar automaticamente no Google Play (track interno)"
        required: false
        default: false
        type: boolean
      play_track:
        description: "Track do Google Play"
        required: false
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  build-aab:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Validate Android module
        shell: bash
        run: |
          set -euo pipefail
          test -f android/build.gradle || (echo "android/build.gradle nao encontrado" && exit 1)
          test -f android/app/build.gradle || (echo "android/app/build.gradle nao encontrado" && exit 1)

      - name: Decode keystore & write keystore.properties
        env:
          WF_KEYSTORE_BASE64: ${{ secrets.WF_KEYSTORE_BASE64 }}
          WF_KEYSTORE_PASSWORD: ${{ secrets.WF_KEYSTORE_PASSWORD }}
          WF_KEY_ALIAS: ${{ secrets.WF_KEY_ALIAS }}
          WF_KEY_PASSWORD: ${{ secrets.WF_KEY_PASSWORD }}
        run: |
          if [ -z "$WF_KEYSTORE_BASE64" ]; then
            echo "Missing secret WF_KEYSTORE_BASE64" >&2
            exit 1
          fi
          if [ -z "$WF_KEYSTORE_PASSWORD" ] || [ -z "$WF_KEY_ALIAS" ] || [ -z "$WF_KEY_PASSWORD" ]; then
            echo "Missing signing secrets (WF_KEYSTORE_PASSWORD/WF_KEY_ALIAS/WF_KEY_PASSWORD)" >&2
            exit 1
          fi

          echo "$WF_KEYSTORE_BASE64" | base64 --decode > android/release.keystore

          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$WF_KEYSTORE_PASSWORD
          keyAlias=$WF_KEY_ALIAS
          keyPassword=$WF_KEY_PASSWORD
          EOF

      - name: Build release AAB
        run: |
          gradle -p android clean bundleRelease --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: wallfruits-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload to Google Play
        if: ${{ github.event.inputs.upload_to_play == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ secrets.GOOGLE_PLAY_PACKAGE_NAME }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.play_track }}
          status: completed
