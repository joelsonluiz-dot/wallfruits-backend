{% extends "base.html" %}

{% block title %}Redefinir Senha - WallFruits{% endblock %}

{% block content %}
<style>
    .auth-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 200px);
        padding: 2rem 0;
    }
    .auth-card {
        width: 100%;
        max-width: 460px;
    }
    .auth-header {
        text-align: center;
        margin-bottom: 1.6rem;
    }
    .auth-header h1 {
        font-size: 1.7rem;
        font-weight: 800;
        margin-bottom: 0.4rem;
    }
    .auth-header p {
        color: var(--wf-text-secondary);
        font-size: 0.9rem;
    }
    .wf-password-wrap {
        position: relative;
    }
    .wf-password-toggle {
        position: absolute;
        right: 0.55rem;
        top: 50%;
        transform: translateY(-50%);
        border: 1px solid var(--wf-border);
        background: rgba(255,255,255,0.92);
        color: var(--wf-text-secondary);
        border-radius: 8px;
        font-size: 0.72rem;
        font-weight: 700;
        padding: 0.2rem 0.45rem;
    }
</style>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Redefinir senha</h1>
            <p>Crie uma nova senha para sua conta.</p>
        </div>

        <div class="wf-card">
            <div class="card-body" style="padding:2rem;">
                <form id="resetPasswordForm">
                    <div class="mb-3">
                        <label for="newPassword" class="wf-label">Nova senha</label>
                        <div class="wf-password-wrap">
                            <input type="password" class="wf-input form-control" id="newPassword" placeholder="Mínimo 6 caracteres" minlength="6" required>
                            <button type="button" class="wf-password-toggle" id="toggleNewPassword">Mostrar</button>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="confirmPassword" class="wf-label">Confirmar nova senha</label>
                        <div class="wf-password-wrap">
                            <input type="password" class="wf-input form-control" id="confirmPassword" placeholder="Repita a nova senha" minlength="6" required>
                            <button type="button" class="wf-password-toggle" id="toggleConfirmPassword">Mostrar</button>
                        </div>
                    </div>

                    <div id="resetMsg" style="display:none; padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem;"></div>

                    <button type="submit" id="resetBtn" class="btn btn-wf-primary w-100" style="padding:0.75rem;">
                        Confirmar nova senha
                    </button>
                </form>
            </div>
        </div>

        <div style="text-align:center; margin-top:1rem;">
            <a href="/login" class="wf-link">Voltar para login</a>
        </div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';

    const form = document.getElementById('resetPasswordForm');
    const btn = document.getElementById('resetBtn');
    const msg = document.getElementById('resetMsg');

    function setMsg(type, text) {
        msg.style.display = 'block';
        if (type === 'success') {
            msg.style.background = 'rgba(0,255,136,0.15)';
            msg.style.border = '1px solid #00ff88';
            msg.style.color = '#00b573';
        } else {
            msg.style.background = 'rgba(255,60,60,0.15)';
            msg.style.border = '1px solid #ff3c3c';
            msg.style.color = '#ff6b6b';
        }
        msg.textContent = text;
    }

    if (!token) {
        setMsg('error', 'Token de recuperação ausente. Solicite um novo e-mail de recuperação.');
        btn.disabled = true;
    }

    document.getElementById('toggleNewPassword').addEventListener('click', (event) => {
        const input = document.getElementById('newPassword');
        const showing = input.type === 'text';
        input.type = showing ? 'password' : 'text';
        event.currentTarget.textContent = showing ? 'Mostrar' : 'Ocultar';
    });

    document.getElementById('toggleConfirmPassword').addEventListener('click', (event) => {
        const input = document.getElementById('confirmPassword');
        const showing = input.type === 'text';
        input.type = showing ? 'password' : 'text';
        event.currentTarget.textContent = showing ? 'Mostrar' : 'Ocultar';
    });

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (!token) return;

        const newPassword = String(document.getElementById('newPassword').value || '');
        const confirmPassword = String(document.getElementById('confirmPassword').value || '');

        if (newPassword.length < 6) {
            setMsg('error', 'A nova senha deve ter no mínimo 6 caracteres.');
            return;
        }

        if (newPassword !== confirmPassword) {
            setMsg('error', 'As senhas não conferem.');
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Salvando...';

        try {
            const response = await apiRequest('/auth/reset-password', 'POST', {
                token,
                new_password: newPassword,
            });

            setMsg('success', response?.message || 'Operação realizada com sucesso. Redirecionando para login...');
            setTimeout(() => {
                window.location.href = '/login';
            }, 1400);
        } catch (error) {
            setMsg('error', error.message || 'Não foi possível redefinir a senha.');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Confirmar nova senha';
        }
    });
</script>
{% endblock %}
