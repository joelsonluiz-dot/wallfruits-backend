{% extends "base.html" %}

{% block title %}Serviços - WallFruits{% endblock %}

{% block content %}
<style>
    .services-shell {
        display: grid;
        gap: 1rem;
    }

    .services-hero {
        border-radius: 20px;
        border: 1px solid rgba(24, 86, 58, 0.24);
        background: linear-gradient(135deg, #eaf7ee 0%, #eef6ff 58%, #fffef7 100%);
        box-shadow: 0 16px 32px rgba(18, 64, 43, 0.14);
        padding: 1.1rem;
        display: grid;
        gap: 0.65rem;
    }

    .services-hero h1 {
        margin: 0;
        font-size: 1.48rem;
        font-weight: 900;
        letter-spacing: -0.02em;
        color: #18563b;
    }

    .services-hero p {
        margin: 0;
        color: #325f89;
        font-size: 0.9rem;
        font-weight: 600;
    }

    .services-search-row {
        margin-top: 0.15rem;
        display: grid;
        grid-template-columns: 1fr;
        gap: 0.45rem;
    }

    .services-search-wrap {
        position: relative;
    }

    .services-search-wrap .material-icons {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 18px;
        color: #4d6f91;
        pointer-events: none;
    }

    .services-search-input {
        padding-left: 2rem !important;
    }

    .services-category-chips {
        display: flex;
        flex-wrap: nowrap;
        overflow-x: auto;
        gap: 0.44rem;
        padding-bottom: 0.12rem;
    }

    .services-category-chip {
        border: 1px solid rgba(23, 87, 58, 0.24);
        border-radius: 999px;
        background: #ffffff;
        color: #246243;
        font-size: 0.74rem;
        font-weight: 800;
        padding: 0.34rem 0.66rem;
        cursor: pointer;
        transition: transform var(--wf-motion-fast) ease, box-shadow var(--wf-motion-fast) ease, border-color var(--wf-motion-fast) ease, background-color var(--wf-motion-fast) ease;
    }

    .services-category-chip:hover {
        transform: translateY(-1px);
        border-color: rgba(23, 87, 58, 0.42);
        box-shadow: 0 8px 16px rgba(21, 77, 49, 0.14);
    }

    .services-category-chip:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.22), 0 8px 16px rgba(21, 77, 49, 0.14);
    }

    .services-category-chip.active {
        background: linear-gradient(130deg, #1d6f45, #2b8a58);
        color: #fff;
        border-color: transparent;
        box-shadow: 0 8px 16px rgba(21, 77, 49, 0.22);
    }

    .services-active-filters {
        display: flex;
        flex-wrap: wrap;
        gap: 0.38rem;
    }

    .services-filter-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.28rem;
        border-radius: 999px;
        border: 1px solid rgba(21, 82, 129, 0.22);
        background: linear-gradient(135deg, rgba(242, 251, 255, 0.98), rgba(237, 248, 242, 0.98));
        color: #1b4e83;
        font-size: 0.7rem;
        font-weight: 700;
        padding: 0.22rem 0.56rem;
    }

    .services-filter-chip button {
        border: none;
        background: transparent;
        color: #2f638f;
        font-size: 0.84rem;
        line-height: 1;
        padding: 0;
        cursor: pointer;
    }

    .services-filter-chip.clear-all {
        border-color: rgba(153, 53, 53, 0.24);
        background: linear-gradient(135deg, rgba(255, 244, 244, 0.98), rgba(255, 236, 236, 0.98));
        color: #a23333;
        cursor: pointer;
    }

    .services-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.78rem;
        align-items: stretch;
    }

    .services-list > * {
        content-visibility: auto;
        contain-intrinsic-size: 340px;
    }

    .service-card {
        border: 1px solid rgba(21, 84, 127, 0.16);
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 10px 24px rgba(16, 56, 98, 0.12);
        overflow: hidden;
        cursor: pointer;
        display: grid;
        grid-template-rows: 180px auto;
        transition: transform var(--wf-motion-normal) ease, box-shadow var(--wf-motion-normal) ease, border-color var(--wf-motion-normal) ease;
    }

    .service-card:hover {
        transform: translateY(-2px);
        border-color: rgba(25, 103, 63, 0.34);
        box-shadow: 0 16px 30px rgba(21, 67, 48, 0.17);
    }

    .service-card:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.22), 0 16px 30px rgba(21, 67, 48, 0.17);
    }

    .service-thumb {
        width: 100%;
        height: 100%;
        background: #e9f2ec;
        overflow: hidden;
    }

    .service-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .service-card-body {
        padding: 0.72rem;
        display: grid;
        gap: 0.4rem;
        align-content: start;
    }

    .service-title {
        margin: 0;
        font-size: 0.96rem;
        font-weight: 900;
        color: #1b4d7e;
        line-height: 1.28;
    }

    .service-desc {
        margin: 0;
        font-size: 0.77rem;
        color: #4f6f90;
        line-height: 1.42;
        min-height: 2.7em;
    }

    .service-meta {
        display: flex;
        justify-content: space-between;
        gap: 0.55rem;
        align-items: center;
        flex-wrap: wrap;
    }

    .service-location {
        font-size: 0.72rem;
        color: #4f6f90;
        font-weight: 700;
    }

    .service-price {
        font-size: 0.8rem;
        color: #1a6a40;
        font-weight: 900;
    }

    .service-card-actions {
        display: flex;
        justify-content: space-between;
        gap: 0.44rem;
        margin-top: 0.18rem;
    }

    .service-open-tab-btn,
    .service-open-detail-btn {
        border-radius: 10px;
        font-size: 0.72rem;
        font-weight: 800;
        padding: 0.38rem 0.56rem;
        text-decoration: none;
        text-align: center;
        transition: transform var(--wf-motion-normal) ease, box-shadow var(--wf-motion-normal) ease, border-color var(--wf-motion-normal) ease;
    }

    .service-open-tab-btn {
        border: 1px solid rgba(24, 83, 130, 0.2);
        background: #f4f8ff;
        color: #245481;
        flex: 1;
    }

    .service-open-detail-btn {
        border: 1px solid rgba(23, 87, 58, 0.24);
        background: linear-gradient(130deg, #1d6f45, #2b8a58);
        color: #fff;
        min-width: 122px;
    }

    .service-open-tab-btn:hover,
    .service-open-detail-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 16px rgba(22, 70, 108, 0.16);
    }

    .service-open-tab-btn:focus-visible,
    .service-open-detail-btn:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.22), 0 8px 16px rgba(22, 70, 108, 0.16);
    }

    .service-empty {
        border: 1px dashed rgba(18, 78, 123, 0.24);
        border-radius: 12px;
        padding: 0.9rem;
        color: #4a6b8e;
        background: #fff;
        font-weight: 700;
        font-size: 0.82rem;
    }

    @media (max-width: 920px) {
        .services-list {
            grid-template-columns: 1fr;
        }

        .service-card {
            grid-template-rows: 170px auto;
        }
    }

    @media (max-width: 560px) {
        .services-shell {
            gap: 0.78rem;
        }

        .services-hero {
            padding: 0.88rem;
        }

        .service-card {
            grid-template-rows: 156px auto;
        }

        .service-card-body {
            padding: 0.66rem;
            gap: 0.34rem;
        }

        .service-card-actions {
            flex-direction: column;
        }

        .service-open-detail-btn {
            min-width: 100%;
        }

        .services-category-chips {
            gap: 0.36rem;
        }
    }
</style>

<div class="services-shell">
    <section class="services-hero">
        <h1>Serviços Agrícolas</h1>
        <p>Escolha um serviço para ver detalhes e solicitar atendimento especializado na sua região.</p>
        <div class="services-search-row">
            <div class="services-search-wrap">
                <span class="material-icons">search</span>
                <input id="servicesSearchInput" class="wf-input form-control services-search-input" type="text" placeholder="Buscar por serviço, descrição, local ou categoria">
            </div>
        </div>
        <div id="servicesCategoryChips" class="services-category-chips"></div>
        <div id="servicesActiveFilters" class="services-active-filters"></div>
    </section>

    <section>
        <div id="servicesList" class="services-list"></div>
    </section>
</div>

<script>
    (function setupServicesPage() {
        const fallbackServices = [
            {
                id: '1',
                titulo: 'Análise de Solo',
                descricao: 'Diagnóstico completo da fertilidade com recomendação técnica para correção e produtividade.',
                preco: 'R$ 100',
                local: 'Petrolina - PE',
                imagem: 'https://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&fit=crop&w=1000&q=80',
                ficha_tecnica: { categoria: 'Solo' }
            },
            {
                id: '2',
                titulo: 'Pulverização com Drone',
                descricao: 'Aplicação de defensivos com precisão em áreas de difícil acesso e menor desperdício.',
                preco: 'R$ 250',
                local: 'Juazeiro - BA',
                imagem: 'https://images.unsplash.com/photo-1472145246862-b24cf25c4a36?auto=format&fit=crop&w=1000&q=80',
                ficha_tecnica: { categoria: 'Pulverização' }
            },
            {
                id: '3',
                titulo: 'Mapeamento de Irrigação',
                descricao: 'Levantamento técnico para distribuir água com eficiência e reduzir custos operacionais.',
                preco: 'R$ 180',
                local: 'Limoeiro do Norte - CE',
                imagem: 'https://images.unsplash.com/photo-1464226184884-fa280b87c399?auto=format&fit=crop&w=1000&q=80',
                ficha_tecnica: { categoria: 'Irrigação' }
            }
        ];

        const listEl = document.getElementById('servicesList');
        const chipsEl = document.getElementById('servicesCategoryChips');

        let allServices = [];
        let officialCategories = [];
        let selectedCategory = 'Todas';
        let servicesSearchTerm = '';
        let servicesSearchDebounce = null;

        if (!listEl || !chipsEl) return;

        function getServiceCategory(service) {
            const ficha = service && typeof service.ficha_tecnica === 'object' ? service.ficha_tecnica : {};
            const value = String((ficha && ficha.categoria) || '').trim();
            return value || 'Sem categoria';
        }

        function normalizeCategory(value) {
            return String(value || '').trim().toLowerCase();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text ?? '';
            return div.innerHTML;
        }

        function redirectGuestToAuth() {
            const next = encodeURIComponent(`${window.location.pathname}${window.location.search}`);
            const goToLogin = window.confirm('Para continuar esta ação, entre na sua conta. Clique em OK para Login ou Cancelar para Criar conta.');
            window.location.href = goToLogin ? `/login?next=${next}` : `/register?next=${next}`;
        }

        function ensureAuthenticatedAction(event) {
            if (localStorage.getItem('token')) return true;
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            redirectGuestToAuth();
            return false;
        }

        function filteredServices() {
            const targetCategory = normalizeCategory(selectedCategory);
            const targetSearch = normalizeCategory(servicesSearchTerm);

            return allServices.filter((service) => {
                const category = normalizeCategory(getServiceCategory(service));
                const categoryMatches = selectedCategory === 'Todas' || category === targetCategory;
                if (!categoryMatches) return false;

                if (!targetSearch) return true;
                const haystack = normalizeCategory([
                    service?.titulo,
                    service?.descricao,
                    service?.local,
                    getServiceCategory(service),
                ].join(' '));
                return haystack.includes(targetSearch);
            });
        }

        function buildServiceDetailUrl(service) {
            return `/services/detail/${encodeURIComponent(service.id)}`;
        }

        function buildServiceChatUrl(service) {
            const providerId = service?.created_by_user?.id;
            if (!providerId) return null;

            const title = encodeURIComponent(service.titulo || 'Serviço agrícola');
            const category = encodeURIComponent(getServiceCategory(service));
            return `/messages?user_id=${encodeURIComponent(providerId)}&service_id=${encodeURIComponent(service.id)}&service_title=${title}&service_category=${category}`;
        }

        function renderCategoryChips() {
            const fromServices = Array.from(new Set(allServices.map((service) => getServiceCategory(service))));
            const categories = Array.from(new Set([...(officialCategories || []), ...fromServices]));
            const options = ['Todas', ...categories];

            chipsEl.innerHTML = options.map((label) => `
                <button type="button" class="services-category-chip ${label === selectedCategory ? 'active' : ''}" data-category="${label}">${label}</button>
            `).join('');

            chipsEl.querySelectorAll('.services-category-chip').forEach((chip) => {
                chip.addEventListener('click', () => {
                    selectedCategory = chip.getAttribute('data-category') || 'Todas';
                    renderCategoryChips();
                    renderActiveFilterChips();

                    const filtered = filteredServices();
                    if (!filtered.length) {
                        renderError('Nenhum serviço encontrado para essa categoria.');
                        return;
                    }

                    renderList(filtered, filtered[0].id);
                });
            });
        }

        function renderActiveFilterChips() {
            const chips = document.getElementById('servicesActiveFilters');
            if (!chips) return;

            const labels = [];
            if (servicesSearchTerm) {
                labels.push({ key: 'search', label: `Busca: ${escapeHtml(servicesSearchTerm)}` });
            }
            if (selectedCategory !== 'Todas') {
                labels.push({ key: 'category', label: `Categoria: ${escapeHtml(selectedCategory)}` });
            }

            if (!labels.length) {
                chips.innerHTML = '';
                return;
            }

            labels.push({ key: 'clearAll', label: 'Limpar filtros' });

            chips.innerHTML = labels.map((item) => `
                <span class="services-filter-chip ${item.key === 'clearAll' ? 'clear-all' : ''}" data-services-chip="${item.key}">
                    <span>${item.label}</span>
                    ${item.key === 'clearAll' ? '' : '<button type="button" aria-label="Remover filtro">×</button>'}
                </span>
            `).join('');

            chips.querySelectorAll('[data-services-chip]').forEach((chip) => {
                chip.addEventListener('click', () => {
                    const key = chip.getAttribute('data-services-chip');
                    if (key === 'search') {
                        servicesSearchTerm = '';
                        const searchInput = document.getElementById('servicesSearchInput');
                        if (searchInput) searchInput.value = '';
                    } else if (key === 'category') {
                        selectedCategory = 'Todas';
                    } else if (key === 'clearAll') {
                        servicesSearchTerm = '';
                        selectedCategory = 'Todas';
                        const searchInput = document.getElementById('servicesSearchInput');
                        if (searchInput) searchInput.value = '';
                    }

                    renderCategoryChips();
                    renderActiveFilterChips();

                    const filtered = filteredServices();
                    if (!filtered.length) {
                        renderError('Nenhum serviço encontrado para os filtros selecionados.');
                        return;
                    }

                    renderList(filtered, filtered[0].id);
                });
            });
        }

        function renderList(services, activeId) {
            listEl.innerHTML = services.map((service) => `
                <article class="service-card ${service.id === activeId ? 'active' : ''}" data-service-id="${escapeHtml(String(service.id))}" tabindex="0" role="link" aria-label="Abrir detalhes do serviço ${escapeHtml(service.titulo || 'Serviço')}">
                    <div class="service-thumb">
                        <img src="${escapeHtml(service.imagem || '/static/icon.svg')}" alt="${escapeHtml(service.titulo || 'Serviço')}" onerror="this.onerror=null; this.src='/static/icon.svg';">
                    </div>
                    <div class="service-card-body">
                        <h3 class="service-title">${escapeHtml(service.titulo || 'Serviço')}</h3>
                        <p class="service-desc">${escapeHtml(service.descricao || '')}</p>
                        <div class="service-meta">
                            <span class="service-location">${escapeHtml(service.local || 'Local não informado')}</span>
                            <span class="service-price">${escapeHtml(service.preco || 'Sob consulta')}</span>
                        </div>
                        <div class="service-card-actions">
                            <a href="${buildServiceDetailUrl(service)}" class="service-open-detail-btn" onclick="event.stopPropagation()">Ver detalhes</a>
                            <a href="${buildServiceDetailUrl(service)}" target="_blank" rel="noopener" class="service-open-tab-btn" onclick="event.stopPropagation()">Abrir em nova aba</a>
                        </div>
                    </div>
                </article>
            `).join('');

            listEl.querySelectorAll('.service-card').forEach((card) => {
                card.addEventListener('click', () => {
                    const serviceId = card.getAttribute('data-service-id');
                    const selected = services.find((item) => String(item.id) === String(serviceId));
                    if (!selected) return;
                    window.location.href = buildServiceDetailUrl(selected);
                });

                card.addEventListener('keydown', (event) => {
                    if (event.key !== 'Enter' && event.key !== ' ') return;
                    const target = event.target instanceof Element ? event.target : null;
                    if (target && target.closest('a, button, input, textarea, select')) return;
                    const serviceId = card.getAttribute('data-service-id');
                    const selected = services.find((item) => String(item.id) === String(serviceId));
                    if (!selected) return;
                    event.preventDefault();
                    window.location.href = buildServiceDetailUrl(selected);
                });
            });

            listEl.querySelectorAll('.service-open-detail-btn, .service-open-tab-btn').forEach((link) => {
                link.addEventListener('click', (event) => {
                    ensureAuthenticatedAction(event);
                });
            });
        }

        function renderLoading() {
            chipsEl.innerHTML = '';
            listEl.innerHTML = '<div class="service-empty">Carregando serviços...</div>';
        }

        function renderError(message) {
            chipsEl.innerHTML = '';
            listEl.innerHTML = `<div class="service-empty">${message}</div>`;
        }

        async function loadServices() {
            renderLoading();

            const searchInput = document.getElementById('servicesSearchInput');
            if (searchInput && !searchInput.dataset.bound) {
                searchInput.dataset.bound = '1';

                const applyServicesSearch = () => {
                    servicesSearchTerm = (searchInput.value || '').trim();
                    renderActiveFilterChips();
                    const filtered = filteredServices();
                    if (!filtered.length) {
                        renderError('Nenhum serviço encontrado para os filtros selecionados.');
                        return;
                    }
                    renderList(filtered, filtered[0].id);
                };

                searchInput.addEventListener('input', () => {
                    if (servicesSearchDebounce) {
                        window.clearTimeout(servicesSearchDebounce);
                    }
                    servicesSearchDebounce = window.setTimeout(() => {
                        applyServicesSearch();
                    }, 220);
                });

                searchInput.addEventListener('keydown', (event) => {
                    if (event.key !== 'Enter') return;
                    event.preventDefault();
                    if (servicesSearchDebounce) {
                        window.clearTimeout(servicesSearchDebounce);
                    }
                    applyServicesSearch();
                });
            }

            try {
                const [servicesData, categoriesData] = await Promise.all([
                    apiRequest('/services'),
                    apiRequest('/services/categories').catch(() => ({ categories: [] })),
                ]);
                const services = Array.isArray(servicesData?.services) ? servicesData.services : [];
                officialCategories = Array.isArray(categoriesData?.categories)
                    ? categoriesData.categories.map((item) => String(item?.label || '').trim()).filter(Boolean)
                    : [];

                if (!services.length) {
                    renderError('Nenhum serviço disponível no momento.');
                    return;
                }

                allServices = services;
                selectedCategory = 'Todas';
                renderCategoryChips();
                renderActiveFilterChips();
                renderList(allServices, allServices[0].id);
            } catch {
                if (!fallbackServices.length) {
                    renderError('Falha ao carregar serviços. Tente novamente em instantes.');
                    return;
                }

                allServices = fallbackServices;
                officialCategories = [];
                selectedCategory = 'Todas';
                renderCategoryChips();
                renderActiveFilterChips();
                renderList(allServices, allServices[0].id);
            }
        }

        loadServices();
    })();
</script>
{% endblock %}
