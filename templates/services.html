{% extends "base.html" %}

{% block title %}Serviços - WallFruits{% endblock %}

{% block content %}
<style>
    .services-shell {
        display: grid;
        gap: 0.95rem;
    }

    .services-hero {
        border-radius: 18px;
        border: 1px solid rgba(29, 97, 58, 0.28);
        background: linear-gradient(138deg, #ecf8ef 0%, #eef7ff 65%, #fffdf4 100%);
        box-shadow: 0 14px 30px rgba(24, 76, 45, 0.14);
        padding: 1rem 1.05rem;
    }

    .services-hero h1 {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 900;
        color: #175838;
        letter-spacing: -0.02em;
    }

    .services-hero p {
        margin: 0.38rem 0 0;
        color: #345f8d;
        font-size: 0.84rem;
        font-weight: 600;
    }

    .services-search-row {
        margin-top: 0.64rem;
        display: grid;
        grid-template-columns: 1fr;
        gap: 0.45rem;
    }

    .services-search-wrap {
        position: relative;
    }

    .services-search-wrap .material-icons {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 18px;
        color: #4d6f91;
        pointer-events: none;
    }

    .services-search-input {
        padding-left: 2rem !important;
    }

    .services-category-chips {
        margin-top: 0.72rem;
        display: flex;
        flex-wrap: nowrap;
        overflow-x: auto;
        gap: 0.42rem;
        padding-bottom: 0.12rem;
    }

    .services-category-chip {
        flex: 0 0 auto;
        border: 1px solid rgba(23, 87, 58, 0.24);
        border-radius: 999px;
        background: #ffffff;
        color: #246243;
        font-size: 0.72rem;
        font-weight: 800;
        padding: 0.34rem 0.62rem;
        cursor: pointer;
        transition: transform var(--wf-motion-fast) ease, box-shadow var(--wf-motion-fast) ease, border-color var(--wf-motion-fast) ease, background-color var(--wf-motion-fast) ease;
    }

    .services-category-chip:hover {
        transform: translateY(-1px);
        border-color: rgba(23, 87, 58, 0.42);
        box-shadow: 0 8px 16px rgba(21, 77, 49, 0.14);
    }

    .services-category-chip:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.22), 0 8px 16px rgba(21, 77, 49, 0.14);
    }

    .services-category-chip.active {
        background: linear-gradient(130deg, #1d6f45, #2b8a58);
        color: #fff;
        border-color: transparent;
        box-shadow: 0 8px 16px rgba(21, 77, 49, 0.22);
    }

    .services-active-filters {
        margin-top: 0.55rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
    }

    .services-filter-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.28rem;
        border-radius: 999px;
        border: 1px solid rgba(21, 82, 129, 0.22);
        background: linear-gradient(135deg, rgba(242, 251, 255, 0.98), rgba(237, 248, 242, 0.98));
        color: #1b4e83;
        font-size: 0.7rem;
        font-weight: 700;
        padding: 0.22rem 0.56rem;
    }

    .services-filter-chip button {
        border: none;
        background: transparent;
        color: #2f638f;
        font-size: 0.84rem;
        line-height: 1;
        padding: 0;
        cursor: pointer;
    }

    .services-filter-chip.clear-all {
        border-color: rgba(153, 53, 53, 0.24);
        background: linear-gradient(135deg, rgba(255, 244, 244, 0.98), rgba(255, 236, 236, 0.98));
        color: #a23333;
        cursor: pointer;
    }

    .services-grid {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 0.85rem;
        align-items: start;
    }

    .services-list {
        display: grid;
        gap: 0.65rem;
    }

    .services-list > * {
        content-visibility: auto;
        contain-intrinsic-size: 190px;
    }

    .service-card {
        border: 1px solid rgba(21, 84, 127, 0.18);
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 10px 22px rgba(16, 56, 98, 0.12);
        overflow: hidden;
        cursor: pointer;
        transition: transform var(--wf-motion-normal) ease, box-shadow var(--wf-motion-normal) ease, border-color var(--wf-motion-normal) ease;
    }

    .service-card:hover {
        transform: translateY(-2px);
        border-color: rgba(25, 103, 63, 0.34);
        box-shadow: 0 16px 28px rgba(21, 67, 48, 0.17);
    }

    .service-card:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.22), 0 16px 28px rgba(21, 67, 48, 0.17);
    }

    .service-card.active {
        border-color: rgba(24, 98, 59, 0.48);
        box-shadow: 0 16px 28px rgba(21, 67, 48, 0.22);
        background: linear-gradient(140deg, #f6fff8, #f5fbff);
    }

    .service-card-inner {
        display: grid;
        grid-template-columns: 108px minmax(0, 1fr);
        gap: 0.72rem;
        padding: 0.58rem;
    }

    .service-thumb {
        width: 108px;
        height: 96px;
        border-radius: 10px;
        overflow: hidden;
        background: #e9f2ec;
    }

    .service-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .service-title {
        margin: 0;
        font-size: 0.9rem;
        font-weight: 800;
        color: #1b4d7e;
    }

    .service-desc {
        margin: 0.22rem 0 0;
        font-size: 0.76rem;
        color: #526f92;
        line-height: 1.38;
        min-height: 2em;
    }

    .service-meta {
        margin-top: 0.35rem;
        display: flex;
        justify-content: space-between;
        gap: 0.5rem;
        align-items: center;
    }

    .service-location {
        font-size: 0.7rem;
        color: #4f6f90;
        font-weight: 700;
    }

    .service-price {
        font-size: 0.75rem;
        color: #1a6a40;
        font-weight: 900;
    }

    .service-card-actions {
        margin-top: 0.42rem;
        display: flex;
        justify-content: flex-end;
    }

    .service-open-tab-btn {
        border: 1px solid rgba(24, 83, 130, 0.2);
        border-radius: 10px;
        text-decoration: none;
        background: #f4f8ff;
        color: #245481;
        font-size: 0.7rem;
        font-weight: 800;
        padding: 0.3rem 0.52rem;
        transition: transform var(--wf-motion-normal) ease, box-shadow var(--wf-motion-normal) ease, border-color var(--wf-motion-normal) ease;
    }

    .service-open-tab-btn:hover {
        transform: translateY(-1px);
        border-color: rgba(24, 83, 130, 0.36);
        box-shadow: 0 8px 16px rgba(22, 70, 108, 0.16);
    }

    .service-open-tab-btn:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.22), 0 8px 16px rgba(22, 70, 108, 0.16);
    }

    .service-detail {
        border: 1px solid rgba(21, 84, 127, 0.16);
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 10px 24px rgba(19, 58, 94, 0.12);
        overflow: hidden;
        position: sticky;
        top: 1rem;
    }

    .service-detail-cover {
        width: 100%;
        height: 210px;
        object-fit: cover;
        background: #edf4ef;
    }

    .service-detail-body {
        padding: 0.92rem;
        display: grid;
        gap: 0.5rem;
    }

    .service-detail-title {
        margin: 0;
        font-size: 1.03rem;
        font-weight: 900;
    }

    .service-detail-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 18px rgba(20, 76, 47, 0.2);
        filter: saturate(1.05);
    }

    .service-detail-btn:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.22), 0 10px 18px rgba(20, 76, 47, 0.2);
        color: #fff;
    }

    .service-detail-text {
        margin: 0;
        color: #4e6a8a;
        font-size: 0.8rem;
        line-height: 1.45;
    }

    .service-detail-location {
        margin: 0;
        color: #395e86;
        font-size: 0.78rem;
        font-weight: 700;
    }

    .service-detail-price {
        margin: 0;
        color: #1e6f43;
        font-size: 1rem;
        font-weight: 900;
    }

    .service-tech-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.42rem;
    }

    .service-tech-item {
        border: 1px solid rgba(21, 84, 127, 0.14);
        border-radius: 10px;
        background: #f8fbff;
        padding: 0.36rem 0.45rem;
    }

    .service-tech-key {
        font-size: 0.64rem;
        color: #5a7495;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.03em;
    }

    .service-tech-value {
        font-size: 0.72rem;
        color: #245481;
        font-weight: 700;
    }

    .service-detail-btn {
        border: none;
        border-radius: 12px;
        background: linear-gradient(130deg, #1d6f45, #2b8a58);
        color: #fff;
        font-size: 0.8rem;
        font-weight: 800;
        padding: 0.75rem 0.9rem;
        width: 100%;
        transition: transform var(--wf-motion-normal) ease, box-shadow var(--wf-motion-normal) ease, filter var(--wf-motion-normal) ease;
    }

    .service-detail-btn.secondary {
        background: #edf4fd;
        color: #2b5f94;
        border: 1px solid rgba(20, 78, 122, 0.2);
        text-decoration: none;
        text-align: center;
        display: block;
    }

    .service-empty {
        border: 1px dashed rgba(18, 78, 123, 0.24);
        border-radius: 12px;
        padding: 0.82rem;
        color: #4a6b8e;
        background: #fff;
        font-weight: 700;
        font-size: 0.8rem;
    }

    @media (max-width: 980px) {
        .services-grid {
            grid-template-columns: 1fr;
        }

        .service-detail {
            position: static;
        }
    }

    @media (max-width: 560px) {
        .services-shell {
            gap: 0.72rem;
        }

        .services-hero {
            padding: 0.88rem 0.82rem;
        }

        .service-card-inner {
            grid-template-columns: 88px minmax(0, 1fr);
        }

        .service-thumb {
            width: 88px;
            height: 82px;
        }

        .service-detail-cover {
            height: 182px;
        }

        .service-tech-grid {
            grid-template-columns: 1fr;
        }

        .service-detail-body {
            padding: 0.75rem;
            gap: 0.44rem;
        }
    }
</style>

<div class="services-shell">
    <section class="services-hero">
        <h1>Serviços Agrícolas</h1>
        <p>Escolha um serviço para ver detalhes e solicitar atendimento especializado na sua região.</p>
        <div class="services-search-row">
            <div class="services-search-wrap">
                <span class="material-icons">search</span>
                <input id="servicesSearchInput" class="wf-input form-control services-search-input" type="text" placeholder="Buscar por serviço, descrição, local ou categoria">
            </div>
        </div>
        <div id="servicesCategoryChips" class="services-category-chips"></div>
        <div id="servicesActiveFilters" class="services-active-filters"></div>
    </section>

    <section class="services-grid">
        <div id="servicesList" class="services-list"></div>
        <article id="serviceDetail" class="service-detail"></article>
    </section>
</div>

<script>
    (function setupServicesPage() {
        const fallbackServices = [
            {
                id: '1',
                titulo: 'Análise de Solo',
                descricao: 'Diagnóstico completo da fertilidade com recomendação técnica para correção e produtividade.',
                preco: 'R$ 100',
                local: 'Petrolina - PE',
                imagem: 'https://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&fit=crop&w=1000&q=80',
                ficha_tecnica: { categoria: 'Solo' }
            },
            {
                id: '2',
                titulo: 'Pulverização com Drone',
                descricao: 'Aplicação de defensivos com precisão em áreas de difícil acesso e menor desperdício.',
                preco: 'R$ 250',
                local: 'Juazeiro - BA',
                imagem: 'https://images.unsplash.com/photo-1472145246862-b24cf25c4a36?auto=format&fit=crop&w=1000&q=80',
                ficha_tecnica: { categoria: 'Pulverização' }
            },
            {
                id: '3',
                titulo: 'Mapeamento de Irrigação',
                descricao: 'Levantamento técnico para distribuir água com eficiência e reduzir custos operacionais.',
                preco: 'R$ 180',
                local: 'Limoeiro do Norte - CE',
                imagem: 'https://images.unsplash.com/photo-1464226184884-fa280b87c399?auto=format&fit=crop&w=1000&q=80',
                ficha_tecnica: { categoria: 'Irrigação' }
            }
        ];

        const listEl = document.getElementById('servicesList');
        const detailEl = document.getElementById('serviceDetail');
        const chipsEl = document.getElementById('servicesCategoryChips');

        let allServices = [];
        let officialCategories = [];
        let selectedCategory = 'Todas';
        let servicesSearchTerm = '';
        let servicesSearchDebounce = null;

        if (!listEl || !detailEl || !chipsEl) return;

        function getServiceCategory(service) {
            const ficha = service && typeof service.ficha_tecnica === 'object' ? service.ficha_tecnica : {};
            const value = String((ficha && ficha.categoria) || '').trim();
            return value || 'Sem categoria';
        }

        function normalizeCategory(value) {
            return String(value || '').trim().toLowerCase();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text ?? '';
            return div.innerHTML;
        }

        function filteredServices() {
            const targetCategory = normalizeCategory(selectedCategory);
            const targetSearch = normalizeCategory(servicesSearchTerm);

            return allServices.filter((service) => {
                const category = normalizeCategory(getServiceCategory(service));
                const categoryMatches = selectedCategory === 'Todas' || category === targetCategory;
                if (!categoryMatches) return false;

                if (!targetSearch) return true;
                const haystack = normalizeCategory([
                    service?.titulo,
                    service?.descricao,
                    service?.local,
                    getServiceCategory(service),
                ].join(' '));
                return haystack.includes(targetSearch);
            });
        }

        function buildServiceDetailUrl(service) {
            return `/services/detail/${encodeURIComponent(service.id)}`;
        }

        function buildServiceChatUrl(service) {
            const providerId = service?.created_by_user?.id;
            if (!providerId) return null;

            const title = encodeURIComponent(service.titulo || 'Serviço agrícola');
            const category = encodeURIComponent(getServiceCategory(service));
            return `/messages?user_id=${encodeURIComponent(providerId)}&service_id=${encodeURIComponent(service.id)}&service_title=${title}&service_category=${category}`;
        }

        function renderCategoryChips() {
            const fromServices = Array.from(new Set(allServices.map((service) => getServiceCategory(service))));
            const categories = Array.from(new Set([...(officialCategories || []), ...fromServices]));
            const options = ['Todas', ...categories];

            chipsEl.innerHTML = options.map((label) => `
                <button type="button" class="services-category-chip ${label === selectedCategory ? 'active' : ''}" data-category="${label}">${label}</button>
            `).join('');

            chipsEl.querySelectorAll('.services-category-chip').forEach((chip) => {
                chip.addEventListener('click', () => {
                    selectedCategory = chip.getAttribute('data-category') || 'Todas';
                    renderCategoryChips();
                    renderActiveFilterChips();

                    const filtered = filteredServices();
                    if (!filtered.length) {
                        renderError('Nenhum serviço encontrado para essa categoria.');
                        return;
                    }

                    renderList(filtered, filtered[0].id);
                    renderDetail(filtered[0]);
                });
            });
        }

        function renderActiveFilterChips() {
            const chips = document.getElementById('servicesActiveFilters');
            if (!chips) return;

            const labels = [];
            if (servicesSearchTerm) {
                labels.push({ key: 'search', label: `Busca: ${escapeHtml(servicesSearchTerm)}` });
            }
            if (selectedCategory !== 'Todas') {
                labels.push({ key: 'category', label: `Categoria: ${escapeHtml(selectedCategory)}` });
            }

            if (!labels.length) {
                chips.innerHTML = '';
                return;
            }

            labels.push({ key: 'clearAll', label: 'Limpar filtros' });

            chips.innerHTML = labels.map((item) => `
                <span class="services-filter-chip ${item.key === 'clearAll' ? 'clear-all' : ''}" data-services-chip="${item.key}">
                    <span>${item.label}</span>
                    ${item.key === 'clearAll' ? '' : '<button type="button" aria-label="Remover filtro">×</button>'}
                </span>
            `).join('');

            chips.querySelectorAll('[data-services-chip]').forEach((chip) => {
                chip.addEventListener('click', () => {
                    const key = chip.getAttribute('data-services-chip');
                    if (key === 'search') {
                        servicesSearchTerm = '';
                        const searchInput = document.getElementById('servicesSearchInput');
                        if (searchInput) searchInput.value = '';
                    } else if (key === 'category') {
                        selectedCategory = 'Todas';
                    } else if (key === 'clearAll') {
                        servicesSearchTerm = '';
                        selectedCategory = 'Todas';
                        const searchInput = document.getElementById('servicesSearchInput');
                        if (searchInput) searchInput.value = '';
                    }

                    renderCategoryChips();
                    renderActiveFilterChips();

                    const filtered = filteredServices();
                    if (!filtered.length) {
                        renderError('Nenhum serviço encontrado para os filtros selecionados.');
                        return;
                    }

                    renderList(filtered, filtered[0].id);
                    renderDetail(filtered[0]);
                });
            });
        }

        function renderTech(service) {
            const ficha = (service && typeof service.ficha_tecnica === 'object' && service.ficha_tecnica) || {};
            const labels = {
                categoria: 'Categoria',
                unidade: 'Unidade',
                prazo_atendimento: 'Prazo',
                disponibilidade: 'Disponibilidade',
                area_atuacao: 'Área',
                tempo_execucao: 'Execução',
                equipamentos: 'Equipamentos',
                observacoes: 'Observações'
            };

            const rows = Object.keys(labels)
                .map((key) => ({ key: labels[key], value: String(ficha[key] || '').trim() }))
                .filter((item) => item.value.length > 0);

            if (!rows.length) return '';

            return `
                <div class="service-tech-grid">
                    ${rows.map((item) => `
                        <div class="service-tech-item">
                            <div class="service-tech-key">${item.key}</div>
                            <div class="service-tech-value">${item.value}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderDetail(service) {
            const chatUrl = buildServiceChatUrl(service);
            const serviceTitle = escapeHtml(service.titulo || 'Serviço');
            const serviceDesc = escapeHtml(service.descricao || '');
            const serviceLocal = escapeHtml(service.local || 'Local não informado');
            const servicePrice = escapeHtml(service.preco || 'Sob consulta');
            const serviceImage = escapeHtml(service.imagem || '/static/icon.svg');
            detailEl.innerHTML = `
                <img class="service-detail-cover" src="${serviceImage}" alt="${serviceTitle}" onerror="this.onerror=null; this.src='/static/icon.svg';">
                <div class="service-detail-body">
                    <h2 class="service-detail-title">${serviceTitle}</h2>
                    <p class="service-detail-text">${serviceDesc}</p>
                    <p class="service-detail-location">📍 ${serviceLocal}</p>
                    <p class="service-detail-price">${servicePrice}</p>
                    ${renderTech(service)}
                    ${chatUrl ? `<a href="${chatUrl}" class="service-detail-btn">Solicitar orçamento no bate-papo</a>` : '<div class="service-empty">Este serviço ainda não possui divulgador definido para conversar.</div>'}
                    <a href="${buildServiceDetailUrl(service)}" target="_blank" rel="noopener" class="service-detail-btn secondary">Abrir detalhes completos em outra aba</a>
                </div>
            `;
        }

        function renderList(services, activeId) {
            listEl.innerHTML = services.map((service) => `
                <article class="service-card ${service.id === activeId ? 'active' : ''}" data-service-id="${escapeHtml(String(service.id))}" tabindex="0" role="link" aria-label="Abrir detalhes do serviço ${escapeHtml(service.titulo || 'Serviço')}">
                    <div class="service-card-inner">
                        <div class="service-thumb">
                            <img src="${escapeHtml(service.imagem || '/static/icon.svg')}" alt="${escapeHtml(service.titulo || 'Serviço')}" onerror="this.onerror=null; this.src='/static/icon.svg';">
                        </div>
                        <div>
                            <h3 class="service-title">${escapeHtml(service.titulo || 'Serviço')}</h3>
                            <p class="service-desc">${escapeHtml(service.descricao || '')}</p>
                            <div class="service-meta">
                                <span class="service-location">${escapeHtml(service.local || 'Local não informado')}</span>
                                <span class="service-price">${escapeHtml(service.preco || 'Sob consulta')}</span>
                            </div>
                            <div class="service-card-actions">
                                <a href="${buildServiceDetailUrl(service)}" target="_blank" rel="noopener" class="service-open-tab-btn" onclick="event.stopPropagation()">Abrir detalhes</a>
                            </div>
                        </div>
                    </div>
                </article>
            `).join('');

            listEl.querySelectorAll('.service-card').forEach((card) => {
                card.addEventListener('click', () => {
                    const serviceId = card.getAttribute('data-service-id');
                    const selected = services.find((item) => String(item.id) === String(serviceId));
                    if (!selected) return;
                    window.location.href = buildServiceDetailUrl(selected);
                });

                card.addEventListener('keydown', (event) => {
                    if (event.key !== 'Enter' && event.key !== ' ') return;
                    const target = event.target instanceof Element ? event.target : null;
                    if (target && target.closest('a, button, input, textarea, select')) return;
                    const serviceId = card.getAttribute('data-service-id');
                    const selected = services.find((item) => String(item.id) === String(serviceId));
                    if (!selected) return;
                    event.preventDefault();
                    window.location.href = buildServiceDetailUrl(selected);
                });
            });
        }

        function renderLoading() {
            chipsEl.innerHTML = '';
            listEl.innerHTML = '<div class="service-empty">Carregando serviços...</div>';
            detailEl.innerHTML = '<div class="service-detail-body"><p class="service-detail-text">Preparando detalhes do serviço...</p></div>';
        }

        function renderError(message) {
            chipsEl.innerHTML = '';
            listEl.innerHTML = `<div class="service-empty">${message}</div>`;
            detailEl.innerHTML = '<div class="service-detail-body"><p class="service-detail-text">Não foi possível carregar os detalhes agora.</p></div>';
        }

        async function loadServices() {
            renderLoading();

            const searchInput = document.getElementById('servicesSearchInput');
            if (searchInput && !searchInput.dataset.bound) {
                searchInput.dataset.bound = '1';

                const applyServicesSearch = () => {
                    servicesSearchTerm = (searchInput.value || '').trim();
                    renderActiveFilterChips();
                    const filtered = filteredServices();
                    if (!filtered.length) {
                        renderError('Nenhum serviço encontrado para os filtros selecionados.');
                        return;
                    }
                    renderList(filtered, filtered[0].id);
                    renderDetail(filtered[0]);
                };

                searchInput.addEventListener('input', () => {
                    if (servicesSearchDebounce) {
                        window.clearTimeout(servicesSearchDebounce);
                    }
                    servicesSearchDebounce = window.setTimeout(() => {
                        applyServicesSearch();
                    }, 220);
                });

                searchInput.addEventListener('keydown', (event) => {
                    if (event.key !== 'Enter') return;
                    event.preventDefault();
                    if (servicesSearchDebounce) {
                        window.clearTimeout(servicesSearchDebounce);
                    }
                    applyServicesSearch();
                });
            }

            try {
                const [servicesData, categoriesData] = await Promise.all([
                    apiRequest('/services'),
                    apiRequest('/services/categories').catch(() => ({ categories: [] })),
                ]);
                const services = Array.isArray(servicesData?.services) ? servicesData.services : [];
                officialCategories = Array.isArray(categoriesData?.categories)
                    ? categoriesData.categories.map((item) => String(item?.label || '').trim()).filter(Boolean)
                    : [];

                if (!services.length) {
                    renderError('Nenhum serviço disponível no momento.');
                    return;
                }

                allServices = services;
                selectedCategory = 'Todas';
                renderCategoryChips();
                renderActiveFilterChips();
                renderList(allServices, allServices[0].id);
                renderDetail(allServices[0]);
            } catch {
                if (!fallbackServices.length) {
                    renderError('Falha ao carregar serviços. Tente novamente em instantes.');
                    return;
                }

                allServices = fallbackServices;
                officialCategories = [];
                selectedCategory = 'Todas';
                renderCategoryChips();
                renderActiveFilterChips();
                renderList(allServices, allServices[0].id);
                renderDetail(allServices[0]);
            }
        }

        loadServices();
    })();
</script>
{% endblock %}
