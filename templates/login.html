{% extends "base.html" %}

{% block title %}Entrar - WallFruits{% endblock %}

{% block content %}
<style>
    .auth-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 200px);
        padding: 2rem 0;
    }
    .auth-card {
        width: 100%;
        max-width: 420px;
    }
    .auth-header {
        text-align: center;
        margin-bottom: 2rem;
    }
    .auth-header h1 {
        font-size: 1.8rem;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin-bottom: 0.4rem;
    }
    .auth-header p {
        color: var(--wf-text-secondary);
        font-size: 0.9rem;
    }
    .auth-divider {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin: 1.75rem 0;
        color: var(--wf-text-secondary);
        font-size: 0.8rem;
    }
    .auth-divider::before, .auth-divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--wf-border);
    }
    .auth-footer {
        text-align: center;
        margin-top: 1.5rem;
        font-size: 0.9rem;
        color: var(--wf-text-secondary);
    }
    .wf-password-wrap {
        position: relative;
    }
    .wf-password-toggle {
        position: absolute;
        right: 0.55rem;
        top: 50%;
        transform: translateY(-50%);
        border: 1px solid var(--wf-border);
        background: rgba(255,255,255,0.92);
        color: var(--wf-text-secondary);
        border-radius: 8px;
        font-size: 0.72rem;
        font-weight: 700;
        padding: 0.2rem 0.45rem;
    }
    @media (max-width: 480px) {
        .auth-card { max-width: 100%; }
        .auth-header h1 { font-size: 1.5rem; }
        .auth-wrapper { padding: 1rem 0; min-height: calc(100vh - 160px); }
    }
</style>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Bem-vindo de volta</h1>
            <p>Entre na sua conta para continuar</p>
        </div>

        <div class="wf-card">
            <div class="card-body" style="padding: 2rem;">
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="email" class="wf-label">Email</label>
                        <input type="email" class="wf-input form-control" id="email" placeholder="seu@email.com" autocomplete="email" inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false" required>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="wf-label">Senha</label>
                        <div class="wf-password-wrap">
                            <input type="password" class="wf-input form-control" id="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="current-password" required>
                            <button type="button" class="wf-password-toggle" id="toggleLoginPassword">Mostrar</button>
                        </div>
                        <div style="margin-top:0.45rem;text-align:right;">
                            <a href="/forgot-password" class="wf-link" style="font-size:0.84rem;">Esqueci minha senha</a>
                        </div>
                    </div>
                    <div id="loginMsg" style="display:none; padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem;"></div>
                    <button type="submit" id="loginBtn" class="btn btn-wf-primary w-100" style="padding: 0.75rem;">
                        Entrar &rarr;
                    </button>
                </form>

                <div class="auth-divider">ou</div>

                <button type="button" class="btn btn-wf-secondary w-100 mb-2" id="googleLoginBtn">
                    Entrar com Google
                </button>

                <button type="button" class="btn btn-wf-secondary w-100" id="clearTokenBtn">
                    Sair da sessão atual
                </button>
            </div>
        </div>

        <div class="auth-footer">
            Não tem conta? <a href="/register" class="wf-link">Criar conta grátis</a>
        </div>
    </div>
</div>

<script>
    let loginInFlight = false;

    function setLoginMsg(type, text) {
        const msgDiv = document.getElementById('loginMsg');
        if (!msgDiv) return;
        msgDiv.style.display = 'block';
        if (type === 'success') {
            msgDiv.style.background = 'rgba(0,255,136,0.15)';
            msgDiv.style.border = '1px solid #00ff88';
            msgDiv.style.color = '#00b573';
        } else {
            msgDiv.style.background = 'rgba(255,60,60,0.15)';
            msgDiv.style.border = '1px solid #ff3c3c';
            msgDiv.style.color = '#ff6b6b';
        }
        msgDiv.textContent = text;
    }

    async function handleOAuthCallbackIfAny() {
        const hashParams = new URLSearchParams(window.location.hash.replace('#', ''));
        const accessToken = hashParams.get('access_token');
        const errorDescription = hashParams.get('error_description');

        if (errorDescription) {
            alert('Falha no login Google: ' + decodeURIComponent(errorDescription));
            window.history.replaceState({}, document.title, window.location.pathname);
            return;
        }

        if (!accessToken) {
            return;
        }

        try {
            const response = await apiRequest('/auth/supabase/exchange', 'POST', {
                access_token: accessToken,
            });

            localStorage.setItem('token', response.access_token);
            localStorage.setItem('user', JSON.stringify(response.user || {}));

            // Remove token/hash da URL para não vazar em histórico.
            window.history.replaceState({}, document.title, window.location.pathname);
            setLoginMsg('success', 'Login Google realizado com sucesso. Redirecionando...');
            window.location.href = '/';
        } catch (error) {
            setLoginMsg('error', 'Erro ao concluir login Google: ' + error.message);
        }
    }

    document.getElementById('googleLoginBtn').addEventListener('click', () => {
        window.location.href = '/api/auth/google/login';
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (loginInFlight) return;

        const btn = document.getElementById('loginBtn');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');

        emailInput.value = emailInput.value.trim().toLowerCase();
        const email = emailInput.value;
        const password = passwordInput.value;

        if (!email || !password) {
            setLoginMsg('error', 'Informe email e senha para entrar.');
            return;
        }

        loginInFlight = true;
        btn.disabled = true;
        btn.innerHTML = '<span style="display:inline-block;width:1rem;height:1rem;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:0.5rem;"></span> Entrando...';

        try {
            const response = await apiRequest('/auth/login', 'POST', { email, password });
            if (response.access_token) {
                localStorage.setItem('token', response.access_token);
                localStorage.setItem('user', JSON.stringify(response.user || {}));
                setLoginMsg('success', 'Login realizado com sucesso. Redirecionando...');
                window.location.href = '/';
            } else {
                setLoginMsg('error', 'Erro no login: ' + (response.detail || 'Credenciais inválidas'));
            }
        } catch (error) {
            setLoginMsg('error', 'Erro: ' + error.message);
        } finally {
            loginInFlight = false;
            btn.disabled = false;
            btn.innerHTML = 'Entrar &rarr;';
        }
    });

    document.getElementById('clearTokenBtn').addEventListener('click', () => {
        clearSessionToken();
        setLoginMsg('success', 'Sessão removida no navegador.');
    });

    document.getElementById('toggleLoginPassword').addEventListener('click', (event) => {
        const input = document.getElementById('password');
        const showing = input.type === 'text';
        input.type = showing ? 'password' : 'text';
        event.currentTarget.textContent = showing ? 'Mostrar' : 'Ocultar';
    });

    handleOAuthCallbackIfAny();
</script>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
{% endblock %}
