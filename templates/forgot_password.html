{% extends "base.html" %}

{% block title %}Recuperar Senha - WallFruits{% endblock %}

{% block content %}
<style>
    .auth-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 200px);
        padding: 2rem 0;
    }
    .auth-card {
        width: 100%;
        max-width: 440px;
    }
    .auth-header {
        text-align: center;
        margin-bottom: 1.8rem;
    }
    .auth-header h1 {
        font-size: 1.7rem;
        font-weight: 800;
        letter-spacing: -0.4px;
        margin-bottom: 0.4rem;
    }
    .auth-header p {
        color: var(--wf-text-secondary);
        font-size: 0.9rem;
    }
    .auth-footer {
        text-align: center;
        margin-top: 1.4rem;
        font-size: 0.9rem;
        color: var(--wf-text-secondary);
    }
</style>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Recuperar conta</h1>
            <p>Informe seu e-mail para receber o link de redefinição de senha.</p>
        </div>

        <div class="wf-card">
            <div class="card-body" style="padding: 2rem;">
                <form id="forgotPasswordForm">
                    <div class="mb-3">
                        <label for="email" class="wf-label">E-mail da conta</label>
                        <input type="email" class="wf-input form-control" id="email" placeholder="seu@email.com" autocomplete="email" required>
                    </div>

                    <div id="forgotMsg" style="display:none; padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem;"></div>

                    <button type="submit" id="forgotBtn" class="btn btn-wf-primary w-100" style="padding: 0.75rem;">
                        Enviar link de recuperação
                    </button>
                </form>
            </div>
        </div>

        <div class="auth-footer">
            Lembrou sua senha? <a href="/login" class="wf-link">Voltar para login</a>
        </div>
    </div>
</div>

<script>
    const form = document.getElementById('forgotPasswordForm');
    const btn = document.getElementById('forgotBtn');
    const msg = document.getElementById('forgotMsg');

    function setMsg(type, text) {
        msg.style.display = 'block';
        if (type === 'success') {
            msg.style.background = 'rgba(0,255,136,0.15)';
            msg.style.border = '1px solid #00ff88';
            msg.style.color = '#00b573';
        } else {
            msg.style.background = 'rgba(255,60,60,0.15)';
            msg.style.border = '1px solid #ff3c3c';
            msg.style.color = '#ff6b6b';
        }
        msg.textContent = text;
    }

    form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const emailInput = document.getElementById('email');
        const email = String(emailInput.value || '').trim().toLowerCase();

        if (!email) {
            setMsg('error', 'Informe um e-mail válido.');
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Enviando...';

        try {
            await apiRequest('/auth/forgot-password', 'POST', { email });
            window.location.href = `/forgot-password/confirmation?email=${encodeURIComponent(email)}`;
        } catch (error) {
            setMsg('error', error.message || 'Não foi possível enviar o e-mail agora.');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Enviar link de recuperação';
        }
    });
</script>
{% endblock %}
