{% extends "base.html" %}

{% block title %}Propostas | WallFruits Store{% endblock %}

{% block content %}
<style>
    .proposal-shell { display: grid; gap: 0.85rem; }
    .proposal-head { display: flex; justify-content: space-between; gap: 0.7rem; align-items: center; flex-wrap: wrap; }
    .proposal-head h1 { margin: 0; font-size: 1.24rem; font-weight: 900; color: #2E7D32; }
    .proposal-list { display: grid; gap: 0.65rem; }
    .proposal-card {
        border: 1px solid #d6e7d8;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 10px 20px rgba(30, 85, 34, 0.1);
        padding: 0.76rem;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.65rem;
        align-items: center;
    }
    .proposal-title { margin: 0; color: #1f5e29; font-size: 0.88rem; font-weight: 800; }
    .proposal-meta { margin: 0.18rem 0 0; color: #607764; font-size: 0.74rem; }
    .proposal-badge {
        border-radius: 999px;
        padding: 0.28rem 0.62rem;
        font-size: 0.66rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.04em;
    }
    .proposal-badge.pending { background: #fff4dc; color: #8a5b00; }
    .proposal-badge.reviewed { background: #ecf7ff; color: #1f5b85; }
    .proposal-badge.accepted { background: #e5f7ea; color: #1f6a35; }
    .proposal-badge.rejected { background: #ffe8ea; color: #8e2f38; }
    .proposal-badge.cancelled { background: #f0f1f3; color: #59616c; }

    @media (max-width: 768px) {
        .proposal-card { grid-template-columns: 1fr; align-items: flex-start; }
    }
</style>

<div class="proposal-shell">
    <div class="proposal-head">
        <h1>Minhas propostas por volume</h1>
        <div class="d-flex gap-2 flex-wrap">
            <a href="/store" class="btn btn-wf-secondary">Voltar para loja</a>
            <a href="/store/cart" class="btn btn-wf-secondary">Abrir carrinho</a>
        </div>
    </div>

    <div id="proposalFeedback"></div>
    <section id="proposalList" class="proposal-list"></section>
</div>

<script>
    (function setupProposalsPage() {
        const list = document.getElementById('proposalList');
        const feedback = document.getElementById('proposalFeedback');

        function showMessage(type, text) {
            if (!feedback) return;
            const cls = type === 'error' ? 'wf-alert wf-alert-error' : 'wf-alert wf-alert-info';
            const wrap = document.createElement('div');
            wrap.className = cls;
            wrap.textContent = String(text || '');
            feedback.innerHTML = '';
            feedback.appendChild(wrap);
        }

        function escapeHtml(value) {
            const div = document.createElement('div');
            div.textContent = String(value ?? '');
            return div.innerHTML;
        }

        function requireAuth() {
            if (!localStorage.getItem('token')) {
                window.location.href = '/login';
                return false;
            }
            return true;
        }

        function statusLabel(status) {
            const map = {
                pending: 'Pendente',
                reviewed: 'Em análise',
                accepted: 'Aceita',
                rejected: 'Recusada',
                cancelled: 'Cancelada',
            };
            return map[status] || status;
        }

        async function loadProposals() {
            if (!requireAuth()) return;

            try {
                const data = await apiRequest('/store/quote/my');
                const quotes = Array.isArray(data?.quotes) ? data.quotes : [];

                if (!quotes.length) {
                    list.innerHTML = '<div class="wf-alert wf-alert-info">Você ainda não enviou propostas por volume.</div>';
                    return;
                }

                list.innerHTML = quotes.map((quote) => `
                    <article class="proposal-card">
                        <div>
                            <h2 class="proposal-title">${escapeHtml(quote.product_name)}</h2>
                            <p class="proposal-meta">Fornecedor: ${escapeHtml(quote.supplier_name)}</p>
                            <p class="proposal-meta">Quantidade: ${Number(quote.requested_quantity).toFixed(2)} ${quote.unit || 'un'} | Preço alvo: ${quote.target_price ? `R$ ${Number(quote.target_price).toFixed(2)}` : 'não informado'}</p>
                            ${quote.message ? `<p class="proposal-meta">Mensagem: ${escapeHtml(quote.message)}</p>` : ''}
                            <a href="/store/product/${encodeURIComponent(quote.product_slug || '')}" class="btn btn-sm btn-outline-success mt-1">Ver produto</a>
                        </div>
                        <span class="proposal-badge ${escapeHtml(quote.status)}">${escapeHtml(statusLabel(quote.status))}</span>
                    </article>
                `).join('');
            } catch (error) {
                showMessage('error', error.message || 'Falha ao carregar propostas.');
            }
        }

        loadProposals();
    })();
</script>
{% endblock %}
