{% extends "base.html" %}

{% block title %}Pedidos | WallFruits Store{% endblock %}

{% block content %}
<style>
    .orders-shell { display: grid; gap: 0.85rem; }
    .orders-head { display: flex; justify-content: space-between; align-items: center; gap: 0.65rem; flex-wrap: wrap; }
    .orders-head h1 { margin: 0; color: #2E7D32; font-size: 1.26rem; font-weight: 900; }
    .orders-list { display: grid; gap: 0.68rem; }
    .order-card {
        border: 1px solid #d8e7d9;
        border-radius: 15px;
        background: #fff;
        box-shadow: 0 10px 22px rgba(30, 85, 34, 0.1);
        padding: 0.75rem;
        display: grid;
        gap: 0.6rem;
    }
    .order-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
    .order-title { margin: 0; color: #1f5e29; font-size: 0.9rem; font-weight: 900; }
    .order-meta { margin: 0.16rem 0 0; color: #607764; font-size: 0.72rem; }
    .order-pill {
        border-radius: 999px;
        padding: 0.26rem 0.6rem;
        border: 1px solid #cfe3d1;
        background: #f3fbf4;
        color: #2f6d37;
        font-size: 0.66rem;
        font-weight: 800;
        text-transform: uppercase;
    }
    .order-items { border: 1px solid #dde9de; border-radius: 12px; background: #fbfffc; padding: 0.52rem; display: grid; gap: 0.28rem; }
    .order-item-row { display: flex; justify-content: space-between; gap: 0.45rem; font-size: 0.75rem; color: #35583b; }

    .order-timeline { position: relative; display: grid; gap: 0.42rem; padding-left: 1.2rem; }
    .order-timeline::before {
        content: "";
        position: absolute;
        left: 6px;
        top: 0;
        bottom: 0;
        width: 2px;
        background: #d9e9db;
    }
    .timeline-step {
        position: relative;
        border: 1px solid #dce9de;
        border-radius: 10px;
        background: #fff;
        padding: 0.42rem 0.56rem;
    }
    .timeline-step::before {
        content: "";
        position: absolute;
        left: -0.95rem;
        top: 0.72rem;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        border: 2px solid #9fbca4;
        background: #fff;
    }
    .timeline-step.done { background: #f3fbf4; border-color: #cae2cd; }
    .timeline-step.done::before { border-color: #2E7D32; background: #2E7D32; }
    .timeline-step.active { background: #fff8ee; border-color: #ffdcae; }
    .timeline-title { margin: 0; font-size: 0.74rem; font-weight: 800; color: #2f5a36; }
    .timeline-desc { margin: 0.16rem 0 0; font-size: 0.68rem; color: #647d69; }
    .timeline-eta { margin: 0.14rem 0 0; font-size: 0.64rem; color: #7b917f; }
</style>

<div class="orders-shell">
    <div class="orders-head">
        <h1>Acompanhamento de pedidos</h1>
        <div class="d-flex gap-2 flex-wrap">
            <a href="/store" class="btn btn-wf-secondary">Voltar para loja</a>
            <a href="/store/cart" class="btn btn-wf-secondary">Carrinho</a>
        </div>
    </div>

    <div id="ordersFeedback"></div>
    <section id="ordersList" class="orders-list"></section>
</div>

<script>
    (function setupOrdersPage() {
        const list = document.getElementById('ordersList');
        const feedback = document.getElementById('ordersFeedback');

        function showMessage(type, text) {
            if (!feedback) return;
            const cls = type === 'error' ? 'wf-alert wf-alert-error' : 'wf-alert wf-alert-info';
            feedback.innerHTML = `<div class="${cls}">${text}</div>`;
        }

        function requireAuth() {
            if (!localStorage.getItem('token')) {
                window.location.href = '/login';
                return false;
            }
            return true;
        }

        function money(value) {
            return `R$ ${Number(value || 0).toFixed(2)}`;
        }

        function escapeHtml(value) {
            const div = document.createElement('div');
            div.textContent = String(value ?? '');
            return div.innerHTML;
        }

        function formatDate(dateIso) {
            if (!dateIso) return '-';
            const dt = new Date(dateIso);
            if (Number.isNaN(dt.getTime())) return '-';
            return dt.toLocaleString('pt-BR');
        }

        function statusLabel(status) {
            const map = { pending: 'Pendente', paid: 'Pago', shipped: 'Enviado', delivered: 'Entregue', cancelled: 'Cancelado' };
            return map[status] || status;
        }

        function renderOrders(orders) {
            if (!orders.length) {
                list.innerHTML = '<div class="wf-alert wf-alert-info">Você ainda não possui pedidos concluídos.</div>';
                return;
            }

            list.innerHTML = orders.map((order) => {
                const itemsHtml = (order.items || []).map((item) => `
                    <div class="order-item-row">
                        <span>${escapeHtml(item.product_name)} x${item.quantity}</span>
                        <strong>${money(item.subtotal)}</strong>
                    </div>
                `).join('');

                const timelineHtml = (order.timeline || []).map((step) => `
                    <article class="timeline-step ${step.done ? 'done' : ''} ${step.active ? 'active' : ''}">
                        <h3 class="timeline-title">${escapeHtml(step.title)}</h3>
                        <p class="timeline-desc">${escapeHtml(step.description)}</p>
                        <p class="timeline-eta">${step.done ? 'Concluído em: ' : 'Previsão: '}${formatDate(step.eta)}</p>
                    </article>
                `).join('');

                return `
                    <article class="order-card">
                        <div class="order-top">
                            <div>
                                <h2 class="order-title">Pedido #${order.id}</h2>
                                <p class="order-meta">Criado em ${formatDate(order.created_at)} | Pagamento: ${escapeHtml(String(order.payment_method || '-').toUpperCase())}</p>
                            </div>
                            <div class="order-pill">${escapeHtml(statusLabel(order.status))}</div>
                        </div>

                        <div class="order-items">
                            ${itemsHtml}
                            <div class="order-item-row" style="border-top:1px solid #dce9de;padding-top:0.35rem;">
                                <strong>Total</strong>
                                <strong>${money(order.total_amount)}</strong>
                            </div>
                        </div>

                        <div class="order-timeline">${timelineHtml}</div>
                    </article>
                `;
            }).join('');
        }

        async function loadOrders() {
            if (!requireAuth()) return;
            try {
                const data = await apiRequest('/store/orders/my');
                renderOrders(Array.isArray(data?.orders) ? data.orders : []);
            } catch (error) {
                showMessage('error', error.message || 'Não foi possível carregar seus pedidos.');
            }
        }

        loadOrders();
    })();
</script>
{% endblock %}
